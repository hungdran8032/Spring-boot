version: '3.8'

services:
  app:
    build: .
    container_name: web_social_app
    ports:
      - "9999:9000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/blue_dran?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=http://localhost:9999/api/v1/auth/google/callback
      - APP_URL=http://localhost:9999
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - web_social_network

  mysql:
    image: mysql:8.0
    container_name: web_social_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: blue_dran
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web_social_network

  redis:
    image: redis:7-alpine
    container_name: web_social_redis
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    networks:
      - web_social_network

volumes:
  mysql_data:
  redis_data:

networks:
  web_social_network:
    driver: bridge